# ==============================================================================
# CivicLens — Production-oriented Compose (staging / private pilot)
# ==============================================================================
# - MongoDB Atlas is the only database; it is supplied through MONGODB_URL.
# - No host ports on Redis or MinIO (internal network only)
# - Edge nginx terminates TLS (mount certificates under deploy/certs/)
# - MongoDB indexes are created safely by the backend on startup.
# ==============================================================================

services:
  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: ["redis-server", "--requirepass", "${REDIS_PASSWORD}"]
    volumes:
      - redis_data:/data
    networks:
      - internal
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD}", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  minio:
    image: minio/minio:latest
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${S3_ACCESS_KEY}
      MINIO_ROOT_PASSWORD: ${S3_SECRET_KEY}
    volumes:
      - minio_data:/data
    networks:
      - internal
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 30s
      timeout: 10s
      retries: 3

  minio-init:
    image: minio/mc:latest
    depends_on:
      minio:
        condition: service_healthy
    networks:
      - internal
    entrypoint: >
      /bin/sh -c "
        mc alias set local http://minio:9000 $${MINIO_ROOT_USER} $${MINIO_ROOT_PASSWORD};
        mc mb local/$${S3_BUCKET_NAME} --ignore-existing;
      "
    environment:
      MINIO_ROOT_USER: ${S3_ACCESS_KEY}
      MINIO_ROOT_PASSWORD: ${S3_SECRET_KEY}
      S3_BUCKET_NAME: ${S3_BUCKET_NAME}

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    restart: unless-stopped
    env_file:
      - .env
      - ./backend/.env
    environment:
      # Production compose must activate fail-closed validation by default.
      # Override APP_ENV explicitly only for a deliberate private staging run.
      APP_ENV: ${APP_ENV:-production}
      DEBUG: "false"
      REDIS_HOST: redis
      REDIS_PASSWORD: ${REDIS_PASSWORD}
      S3_ENDPOINT_URL: http://minio:9000
      STORAGE_BACKEND: s3
      AI_SERVICE_URL: http://ai-service:8001
    command: ["uvicorn", "app.main:app", "--host", "0.0.0.0", "--port", "8000", "--workers", "${BACKEND_WORKERS:-2}"]
    depends_on:
      redis:
        condition: service_healthy
      minio:
        condition: service_healthy
    networks:
      - internal
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health/ready"]
      interval: 30s
      timeout: 10s
      retries: 5

  celery-worker:
    build:
      context: ./backend
      dockerfile: Dockerfile
    restart: unless-stopped
    command: celery -A app.tasks.celery_app worker --loglevel=info --concurrency=2
    env_file:
      - .env
      - ./backend/.env
    environment:
      APP_ENV: ${APP_ENV:-production}
      DEBUG: "false"
      REDIS_HOST: redis
      REDIS_PASSWORD: ${REDIS_PASSWORD}
      S3_ENDPOINT_URL: http://minio:9000
      STORAGE_BACKEND: s3
    depends_on:
      backend:
        condition: service_healthy
    networks:
      - internal

  ai-service:
    build:
      context: ./ai_service
      dockerfile: Dockerfile
    restart: unless-stopped
    env_file:
      - .env
      - ./ai_service/.env
    networks:
      - internal
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8001/health"]
      interval: 30s
      timeout: 10s
      retries: 3

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        VITE_API_URL: /api/v1
        VITE_MAP_TILE_URL: https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png
        VITE_APP_NAME: CivicLens
    restart: unless-stopped
    networks:
      - internal

  nginx:
    image: nginx:1.27-alpine
    restart: unless-stopped
    depends_on:
      backend:
        condition: service_healthy
      frontend:
        condition: service_started
    ports:
      - "443:443"
      - "80:80"
    volumes:
      - ./deploy/nginx.prod.conf:/etc/nginx/conf.d/default.conf:ro
      - ./deploy/certs:/etc/nginx/certs:ro
    networks:
      - internal

networks:
  internal:
    driver: bridge

volumes:
  redis_data:
  minio_data:
